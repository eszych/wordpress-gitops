apiVersion: apps/v1
kind: Deployment

metadata:
  name: mariadb
  namespace: wordpress

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mariadb

  template:
    metadata:
      labels:
        app: mariadb

    spec:
      containers:
      - name: mariadb
        image: mariadb:11
        ports:
        - containerPort: 3306
        envFrom:
        - secretRef:
            name: mariadb-secret
        volumeMounts:
        - name: mariadb-data
          mountPath: /var/lib/mysql

      volumes:
      - name: mariadb-data
        persistentVolumeClaim:
          claimName: mariadb-pvc