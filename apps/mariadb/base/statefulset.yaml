apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mariadb
  namespace: wordpress

spec:
  serviceName: mariadb

  replicas: 1

  selector:
    matchLabels:
      app: mariadb

  template:
    metadata:
      labels:
        app: mariadb

    spec:
      containers:
      - name: mariadb

        image: mariadb:11

        ports:
        - containerPort: 3306

        envFrom:
        - secretRef:
            name: mariadb-secret

        volumeMounts:
        - name: mariadb-data
          mountPath: /var/lib/mysql

  volumeClaimTemplates:
  - metadata:
      name: mariadb-data

    spec:
      accessModes:
      - ReadWriteOnce

      resources:
        requests:
          storage: 40Gi
