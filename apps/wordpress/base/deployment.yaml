apiVersion: apps/v1
kind: Deployment

metadata:
  name: wordpress
  namespace: wordpress

spec:
  replicas: 1

  selector:
    matchLabels:
      app: wordpress

  template:
    metadata:
      labels:
        app: wordpress

    spec:
      containers:
      - name: wordpress
        image: wordpress:latest

        ports:
        - containerPort: 80

        env:
        - name: WORDPRESS_DB_HOST
          value: mariadb

        - name: WORDPRESS_DB_NAME
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: MARIADB_DATABASE

        - name: WORDPRESS_DB_USER
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: MARIADB_USER

        - name: WORDPRESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: MARIADB_PASSWORD

        volumeMounts:
        - name: wordpress-data
          mountPath: /var/www/html

      volumes:
      - name: wordpress-data
        persistentVolumeClaim:
          claimName: wordpress-pvc
